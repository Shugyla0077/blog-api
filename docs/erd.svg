<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 620" width="980" height="620" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .card { fill: #ffffff; stroke: #334155; stroke-width: 1.8; rx: 8; }
      .header-auth { fill: #1e40af; rx: 8; }
      .header-blog { fill: #0f766e; rx: 8; }
      .title { fill: #ffffff; font-size: 15px; font-weight: 700; }
      .field { fill: #1e293b; font-size: 13px; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .type { fill: #64748b; font-size: 12px; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .badge-pk { fill: #fef3c7; stroke: #d97706; stroke-width: 1; rx: 4; }
      .badge-fk { fill: #e0e7ff; stroke: #4f46e5; stroke-width: 1; rx: 4; }
      .badge-uk { fill: #dcfce7; stroke: #16a34a; stroke-width: 1; rx: 4; }
      .badge-text { font-size: 10px; font-weight: 700; fill: #1e293b; }
      .line { stroke: #475569; stroke-width: 2; fill: none; }
      .line-m2m { stroke: #0f766e; stroke-width: 2; stroke-dasharray: 6 4; fill: none; }
      .rel-label { fill: #334155; font-size: 11px; font-weight: 600; background: #f8fafc; }
      .divider { stroke: #e2e8f0; stroke-width: 1; }
    </style>
  </defs>

  <rect width="980" height="620" class="bg"/>

  <!-- Relationship Lines -->
  <!-- User (1) -> (0..*) Post -->
  <path d="M 300 130 L 380 130" class="line"/>
  <text x="308" y="122" class="rel-label">1</text>
  <text x="358" y="122" class="rel-label">0..*</text>

  <!-- User (1) -> (0..*) Comment -->
  <path d="M 165 300 L 165 445 L 380 445" class="line"/>
  <text x="172" y="318" class="rel-label">1</text>
  <text x="358" y="438" class="rel-label">0..*</text>

  <!-- Category (0..1) -> (0..*) Post -->
  <path d="M 640 130 L 710 130" class="line"/>
  <text x="646" y="122" class="rel-label">0..*</text>
  <text x="680" y="122" class="rel-label">0..1</text>

  <!-- Post (0..*) <-> (0..*) Tag (M2M) -->
  <path d="M 640 245 L 675 245 L 675 345 L 710 345" class="line-m2m"/>
  <text x="646" y="237" class="rel-label">0..*</text>
  <text x="682" y="337" class="rel-label">0..* (M2M)</text>

  <!-- Post (1) -> (0..*) Comment -->
  <path d="M 510 330 L 510 385" class="line"/>
  <text x="518" y="346" class="rel-label">1</text>
  <text x="518" y="378" class="rel-label">0..*</text>

  <!-- ================= USER TABLE (auths.User) ================= -->
  <g transform="translate(30, 40)">
    <rect width="270" height="260" class="card"/>
    <rect width="270" height="36" class="header-auth"/>
    <text x="135" y="23" text-anchor="middle" class="title">auths_user (User)</text>

    <!-- id -->
    <rect x="12" y="48" width="24" height="16" class="badge-pk"/>
    <text x="24" y="60" text-anchor="middle" class="badge-text">PK</text>
    <text x="44" y="60" class="field">id</text>
    <text x="258" y="60" text-anchor="end" class="type">BigAutoField</text>
    <line x1="0" y1="70" x2="270" y2="70" class="divider"/>

    <!-- email -->
    <rect x="12" y="78" width="24" height="16" class="badge-uk"/>
    <text x="24" y="90" text-anchor="middle" class="badge-text">UK</text>
    <text x="44" y="90" class="field">email</text>
    <text x="258" y="90" text-anchor="end" class="type">EmailField(254)</text>
    <line x1="0" y1="100" x2="270" y2="100" class="divider"/>

    <!-- password -->
    <text x="44" y="120" class="field">password</text>
    <text x="258" y="120" text-anchor="end" class="type">CharField(128)</text>
    <line x1="0" y1="130" x2="270" y2="130" class="divider"/>

    <!-- first_name -->
    <text x="44" y="150" class="field">first_name</text>
    <text x="258" y="150" text-anchor="end" class="type">CharField(50)</text>
    <line x1="0" y1="160" x2="270" y2="160" class="divider"/>

    <!-- last_name -->
    <text x="44" y="180" class="field">last_name</text>
    <text x="258" y="180" text-anchor="end" class="type">CharField(50)</text>
    <line x1="0" y1="190" x2="270" y2="190" class="divider"/>

    <!-- is_active -->
    <text x="44" y="210" class="field">is_active</text>
    <text x="258" y="210" text-anchor="end" class="type">Boolean (True)</text>
    <line x1="0" y1="220" x2="270" y2="220" class="divider"/>

    <!-- is_staff / is_superuser -->
    <text x="44" y="240" class="field">is_staff</text>
    <text x="258" y="240" text-anchor="end" class="type">Boolean (False)</text>
  </g>

  <!-- ================= POST TABLE (blog.Post) ================= -->
  <g transform="translate(380, 30)">
    <rect width="260" height="300" class="card"/>
    <rect width="260" height="36" class="header-blog"/>
    <text x="130" y="23" text-anchor="middle" class="title">blog_post (Post)</text>

    <!-- id -->
    <rect x="12" y="48" width="24" height="16" class="badge-pk"/>
    <text x="24" y="60" text-anchor="middle" class="badge-text">PK</text>
    <text x="44" y="60" class="field">id</text>
    <text x="248" y="60" text-anchor="end" class="type">BigAutoField</text>
    <line x1="0" y1="70" x2="260" y2="70" class="divider"/>

    <!-- author_id -->
    <rect x="12" y="76" width="24" height="16" class="badge-fk"/>
    <text x="24" y="88" text-anchor="middle" class="badge-text">FK</text>
    <text x="44" y="88" class="field">author_id</text>
    <text x="248" y="88" text-anchor="end" class="type">FK(User) CASCADE</text>
    <line x1="0" y1="98" x2="260" y2="98" class="divider"/>

    <!-- category_id -->
    <rect x="12" y="104" width="24" height="16" class="badge-fk"/>
    <text x="24" y="116" text-anchor="middle" class="badge-text">FK</text>
    <text x="44" y="116" class="field">category_id</text>
    <text x="248" y="116" text-anchor="end" class="type">FK(Category) NULL</text>
    <line x1="0" y1="126" x2="260" y2="126" class="divider"/>

    <!-- title -->
    <text x="44" y="146" class="field">title</text>
    <text x="248" y="146" text-anchor="end" class="type">CharField(200)</text>
    <line x1="0" y1="156" x2="260" y2="156" class="divider"/>

    <!-- slug -->
    <rect x="12" y="162" width="24" height="16" class="badge-uk"/>
    <text x="24" y="174" text-anchor="middle" class="badge-text">UK</text>
    <text x="44" y="174" class="field">slug</text>
    <text x="248" y="174" text-anchor="end" class="type">SlugField</text>
    <line x1="0" y1="184" x2="260" y2="184" class="divider"/>

    <!-- body -->
    <text x="44" y="204" class="field">body</text>
    <text x="248" y="204" text-anchor="end" class="type">TextField</text>
    <line x1="0" y1="214" x2="260" y2="214" class="divider"/>

    <!-- status -->
    <text x="44" y="232" class="field">status</text>
    <text x="248" y="232" text-anchor="end" class="type">draft | published</text>
    <line x1="0" y1="242" x2="260" y2="242" class="divider"/>

    <!-- created_at -->
    <text x="44" y="260" class="field">created_at</text>
    <text x="248" y="260" text-anchor="end" class="type">DateTimeField</text>
    <line x1="0" y1="270" x2="260" y2="270" class="divider"/>

    <!-- updated_at -->
    <text x="44" y="288" class="field">updated_at</text>
    <text x="248" y="288" text-anchor="end" class="type">DateTimeField</text>
  </g>

  <!-- ================= CATEGORY TABLE (blog.Category) ================= -->
  <g transform="translate(710, 50)">
    <rect width="240" height="135" class="card"/>
    <rect width="240" height="36" class="header-blog"/>
    <text x="120" y="23" text-anchor="middle" class="title">blog_category (Category)</text>

    <!-- id -->
    <rect x="12" y="48" width="24" height="16" class="badge-pk"/>
    <text x="24" y="60" text-anchor="middle" class="badge-text">PK</text>
    <text x="44" y="60" class="field">id</text>
    <text x="228" y="60" text-anchor="end" class="type">BigAutoField</text>
    <line x1="0" y1="70" x2="240" y2="70" class="divider"/>

    <!-- name -->
    <rect x="12" y="78" width="24" height="16" class="badge-uk"/>
    <text x="24" y="90" text-anchor="middle" class="badge-text">UK</text>
    <text x="44" y="90" class="field">name</text>
    <text x="228" y="90" text-anchor="end" class="type">CharField(100)</text>
    <line x1="0" y1="100" x2="240" y2="100" class="divider"/>

    <!-- slug -->
    <rect x="12" y="108" width="24" height="16" class="badge-uk"/>
    <text x="24" y="120" text-anchor="middle" class="badge-text">UK</text>
    <text x="44" y="120" class="field">slug</text>
    <text x="228" y="120" text-anchor="end" class="type">SlugField</text>
  </g>

  <!-- ================= TAG TABLE (blog.Tag) ================= -->
  <g transform="translate(710, 270)">
    <rect width="240" height="135" class="card"/>
    <rect width="240" height="36" class="header-blog"/>
    <text x="120" y="23" text-anchor="middle" class="title">blog_tag (Tag)</text>

    <!-- id -->
    <rect x="12" y="48" width="24" height="16" class="badge-pk"/>
    <text x="24" y="60" text-anchor="middle" class="badge-text">PK</text>
    <text x="44" y="60" class="field">id</text>
    <text x="228" y="60" text-anchor="end" class="type">BigAutoField</text>
    <line x1="0" y1="70" x2="240" y2="70" class="divider"/>

    <!-- name -->
    <rect x="12" y="78" width="24" height="16" class="badge-uk"/>
    <text x="24" y="90" text-anchor="middle" class="badge-text">UK</text>
    <text x="44" y="90" class="field">name</text>
    <text x="228" y="90" text-anchor="end" class="type">CharField(50)</text>
    <line x1="0" y1="100" x2="240" y2="100" class="divider"/>

    <!-- slug -->
    <rect x="12" y="108" width="24" height="16" class="badge-uk"/>
    <text x="24" y="120" text-anchor="middle" class="badge-text">UK</text>
    <text x="44" y="120" class="field">slug</text>
    <text x="228" y="120" text-anchor="end" class="type">SlugField</text>
  </g>

  <!-- ================= COMMENT TABLE (blog.Comment) ================= -->
  <g transform="translate(380, 385)">
    <rect width="260" height="190" class="card"/>
    <rect width="260" height="36" class="header-blog"/>
    <text x="130" y="23" text-anchor="middle" class="title">blog_comment (Comment)</text>

    <!-- id -->
    <rect x="12" y="48" width="24" height="16" class="badge-pk"/>
    <text x="24" y="60" text-anchor="middle" class="badge-text">PK</text>
    <text x="44" y="60" class="field">id</text>
    <text x="248" y="60" text-anchor="end" class="type">BigAutoField</text>
    <line x1="0" y1="70" x2="260" y2="70" class="divider"/>

    <!-- post_id -->
    <rect x="12" y="78" width="24" height="16" class="badge-fk"/>
    <text x="24" y="90" text-anchor="middle" class="badge-text">FK</text>
    <text x="44" y="90" class="field">post_id</text>
    <text x="248" y="90" text-anchor="end" class="type">FK(Post) CASCADE</text>
    <line x1="0" y1="100" x2="260" y2="100" class="divider"/>

    <!-- author_id -->
    <rect x="12" y="108" width="24" height="16" class="badge-fk"/>
    <text x="24" y="120" text-anchor="middle" class="badge-text">FK</text>
    <text x="44" y="120" class="field">author_id</text>
    <text x="248" y="120" text-anchor="end" class="type">FK(User) CASCADE</text>
    <line x1="0" y1="130" x2="260" y2="130" class="divider"/>

    <!-- body -->
    <text x="44" y="150" class="field">body</text>
    <text x="248" y="150" text-anchor="end" class="type">TextField</text>
    <line x1="0" y1="160" x2="260" y2="160" class="divider"/>

    <!-- created_at -->
    <text x="44" y="178" class="field">created_at</text>
    <text x="248" y="178" text-anchor="end" class="type">DateTimeField</text>
  </g>
</svg>
